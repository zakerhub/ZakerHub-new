<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Assignments | Zaker Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Google+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-gray: #5f6368;
            --google-light: #f1f3f4;
            --navy-hub: #172a50;
            --text-dark: #3c4043;
            --border-color: #dadce0;
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles (matching dashboard) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--navy-hub);
            color: white;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 3rem;
        }

        .logo-hub {
            color: #635bff;
        }

        .main-nav {
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            color: #a3acb9;
            text-decoration: none;
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2rem 4rem;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-area h1 {
            font-family: 'Google Sans', sans-serif;
            font-weight: 400;
            font-size: 1.75rem;
            color: var(--text-dark);
        }

        /* Filters */
        .filter-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .filter-tab {
            padding: 12px 16px;
            cursor: pointer;
            color: var(--google-gray);
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        .filter-tab.active {
            color: var(--google-blue);
            border-bottom-color: var(--google-blue);
        }

        /* Assignment List */
        .assignment-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .assignment-item:hover {
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--google-blue);
            color: white;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-title {
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .item-meta {
            font-size: 0.85rem;
            color: var(--google-gray);
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-todo {
            background: #e8f0fe;
            color: var(--google-blue);
        }

        .status-done {
            background: #e6f4ea;
            color: #1e8e3e;
        }

        #no-items {
            text-align: center;
            padding: 48px;
            color: var(--google-gray);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo-area"><span class="logo-hub">ZH</span> Zaker Hub</div>
        <nav class="main-nav">
            <a href="dashboard.html" class="nav-item"><i data-feather="grid" style="margin-right: 12px;"></i> Home</a>
            <a href="dashboard.html" class="nav-item"><i data-feather="book-open" style="margin-right: 12px;"></i> Courses</a>
            <a href="curricula.html" class="nav-item"><i data-feather="file-text" style="margin-right: 12px;"></i> Registration</a>
            <a href="assignments.html" class="nav-item active"><i data-feather="edit-3" style="margin-right: 12px;"></i> Assignments</a>
            <a href="support.html" class="nav-item"><i data-feather="phone-call" style="margin-right: 12px;"></i> We're Here for You</a>
            
            <a href="vimeo_upload.html" class="nav-item" id="navUploadVideo" style="display: none; margin-top: 2rem; border: 1px solid var(--google-blue); color: var(--google-blue);">
                <i data-feather="upload-cloud" style="margin-right: 12px;"></i> Upload Video
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header-area">
            <h1>All Assignments</h1>
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active" onclick="setFilter('all')">All</div>
            <div class="filter-tab" onclick="setFilter('todo')">To-do</div>
            <div class="filter-tab" onclick="setFilter('done')">Done</div>
        </div>

        <div id="assignment-list">
            <!-- Items will be loaded here -->
            <p id="loading-msg">Loading assignments...</p>
        </div>
        <div id="no-items" style="display: none;">
            <i data-feather="check-circle" style="width: 48px; height: 48px; margin-bottom: 12px;"></i>
            <p>Everything is up to date!</p>
        </div>
    </main>

    <script src="js/api-config.js"></script>
    <script>
        let allItems = [];
        let currentFilter = 'all';

        async function init() {
            feather.replace();
            if (!ZakerAPI.auth.isAuthenticated()) {
                window.location.href = "signin.html";
                return;
            }
            
            const user = ZakerAPI.auth.getUser();
            if (user && user.is_staff) {
                const navUploadVideo = document.getElementById('navUploadVideo');
                if (navUploadVideo) navUploadVideo.style.display = 'flex';
            }

            try {
                // Fetch all items across all enrolled courses
                allItems = await ZakerAPI.fetch('/academics/items/');
                renderItems();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-msg').textContent = "Failed to load assignments.";
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => {
                t.classList.toggle('active', t.textContent.toLowerCase() === filter);
            });
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('assignment-list');
            const noItems = document.getElementById('no-items');
            container.innerHTML = "";

            const filtered = allItems.filter(item => {
                if (currentFilter === 'todo') return !item.is_completed;
                if (currentFilter === 'done') return item.is_completed;
                return true;
            });

            if (filtered.length === 0) {
                noItems.style.display = 'block';
                return;
            }

            noItems.style.display = 'none';

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'assignment-item';
                div.onclick = () => window.location.href = `assignment.html?id=${item.id}`;

                const statusLabel = item.is_completed ? 'Done' : 'Assigned';
                const statusClass = item.is_completed ? 'status-done' : 'status-todo';
                const iconMap = {
                    'assignment': 'file-text',
                    'material': 'book',
                    'announcement': 'message-circle',
                    'zoom': 'video'
                };

                div.innerHTML = `
                    <div class="icon-box"><i data-feather="${iconMap[item.type] || 'file-text'}"></i></div>
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-meta">
                            <strong>${item.course_name || 'General'}</strong> • Due ${new Date(item.created_at).toLocaleDateString()}
                        </div>
                    </div>
                    <span class="status-pill ${statusClass}">${statusLabel}</span>
                `;
                container.appendChild(div);
            });
            feather.replace();
        }

        window.onload = init;
    </script>
</body>

</html>
