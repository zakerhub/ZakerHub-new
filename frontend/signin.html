<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ZakerHub</title>
    <link rel="stylesheet" href="./assets/css/signin.css">
    <style>
        .eye-closed { display: none; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-toggle { 
            position: absolute; right: 10px; background: none; border: none; 
            cursor: pointer; color: #6366F1; display: flex; align-items: center;
        }
        .error-message { color: #ef4444; font-size: 0.8rem; margin-top: 5px; min-height: 1.2em; }
        .success-message { display: none; text-align: center; margin-top: 20px; }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#6366F1"/><path d="M12 14h12v8H12v-8zm2 2v4h8v-4h-8zm-2-4h12v2H12v-2zm0 12h12v2H12v-2z" fill="white"/></svg>
                </div>
                <h1>ZakerHub</h1>
                <p>Welcome back! Please sign in.</p>
            </div>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3.75C5.25 3.75 2.04 6.24 1.5 9c.54 2.76 3.75 5.25 7.5 5.25s6.96-2.49 7.5-5.25c-.54-2.76-3.75-5.25-7.5-5.25zm0 8.75a3.5 3.5 0 110-7 3.5 3.5 0 010 7zm0-5.5a2 2 0 100 4 2 2 0 000-4z" fill="currentColor"/></svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.25 2.25l13.5 13.5m-4.125-4.125a3 3 0 01-4.243-4.243m4.243 4.243L9 9m2.625 2.625L15 15M9 5.25c1.83 0 3.51.63 4.84 1.68M3.16 6.93A10.97 10.97 0 019 5.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <h3>Success!</h3>
                <p>Redirecting to dashboard...</p>
            </div>
        </div>
    </div>

    <script>
    const API_URL = "http://127.0.0.1:8000/api/v1";

    // 1. Password Toggle Logic
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeOpen = document.querySelector('.eye-open');
    const eyeClosed = document.querySelector('.eye-closed');

    passwordToggle.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeOpen.style.display = type === 'password' ? 'block' : 'none';
        eyeClosed.style.display = type === 'password' ? 'none' : 'block';
    });

    // 2. Handle Form Submission
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const successMessage = document.getElementById('successMessage');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop page from refreshing
        
        // Clear previous errors
        emailError.textContent = "";
        passwordError.textContent = "";
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Disable button while loading
        submitBtn.disabled = true;
        submitBtn.querySelector('.btn-text').textContent = "Authenticating...";

        try {
            const response = await fetch(`${API_URL}/auth/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: email, // Backend expects "username"
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Save token to localStorage for other pages
                localStorage.setItem('token', data.token);
                
                // Show success UI
                loginForm.style.display = 'none';
                successMessage.style.display = 'block';

                // Redirect after a short delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                // Show specific errors if backend provides them
                if (data.non_field_errors) {
                    passwordError.textContent = "Invalid email or password.";
                } else {
                    passwordError.textContent = data.detail || "Login failed. Please try again.";
                }
            }
        } catch (err) {
            console.error("Connection failed:", err);
            passwordError.textContent = "Could not connect to server.";
        } finally {
            submitBtn.disabled = false;
            submitBtn.querySelector('.btn-text').textContent = "Sign In";
        }
    });
</script>
</body>
</html>
