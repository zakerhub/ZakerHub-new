<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Zaker Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --color-primary-navy: #172a50;
            --color-primary-accent: #635bff;
            --color-text-dark: #30313d;
            --color-text-light: #525f7f;
            --color-bg-light: #f6f9fc;
            --color-white: #ffffff;
            --color-shadow: rgba(23, 42, 80, 0.1);
            --font-family-sans: 'Inter', sans-serif;
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-sans);
            background: radial-gradient(circle at top left, #f6f9fc, #eef3f7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--color-text-dark);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            perspective: 1000px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 50px rgba(23, 42, 80, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-box {
            width: 54px;
            height: 54px;
            background: var(--color-primary-accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            box-shadow: 0 8px 20px rgba(99, 91, 255, 0.3);
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .logo-box svg {
            width: 28px;
            height: 28px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-primary-navy);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--color-text-light);
            font-size: 0.95rem;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-dark);
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-primary-accent);
            box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.1);
        }

        .form-group input:focus+i {
            color: var(--color-primary-accent);
        }

        /* --- Password Specific --- */
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--color-primary-accent);
        }

        /* --- Button --- */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary-navy);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #233b6e;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(23, 42, 80, 0.15);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none !important;
        }

        /* --- Messages --- */
        .error-message {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 500;
            display: none;
        }

        .success-message {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .success-icon {
            width: 48px;
            height: 48px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        /* --- Navigation Links --- */
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-text-light);
        }

        .auth-footer a {
            color: var(--color-primary-accent);
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: opacity 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card" id="authCard">
            <div class="login-header">
                <div class="logo-box">
                    <i data-feather="box"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your Zaker Hub account</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-feather="mail"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="error-message" id="emailError">Please enter a valid email.</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-feather="lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i data-feather="eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError">Invalid password.</div>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <div class="spinner" id="btnSpinner"></div>
                    <span id="btnText">Sign In</span>
                    <i data-feather="arrow-right" id="btnIcon"></i>
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <div class="success-icon">
                    <i data-feather="check"></i>
                </div>
                <h3>Success!</h3>
                <p>Accessing your dashboard...</p>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();

            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordToggleIcon = passwordToggle.querySelector('i');
            const globalError = document.getElementById('passwordError'); // Reuse for API errors

            // 1. Password Toggle
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                passwordToggleIcon.className = type === 'password' ? 'feather-eye' : 'feather-eye-off';
                feather.replace();
            });

            // 2. Form Submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear previous state
                globalError.style.display = 'none';
                const email = document.getElementById('email').value;
                const password = passwordInput.value;

                if (!email || !password) {
                    globalError.textContent = "Please fill in all fields.";
                    globalError.style.display = 'block';
                    return;
                }

                // Loading state
                submitBtn.disabled = true;
                btnSpinner.style.display = 'block';
                btnIcon.style.display = 'none';
                btnText.textContent = "Checking...";

                try {
                    await ZakerAPI.auth.login(email, password);

                    // Success state
                    document.getElementById('loginForm').style.display = 'none';
                    document.querySelector('.auth-footer').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);

                } catch (err) {
                    console.error("Login Error:", err);
                    globalError.textContent = err.message || "Invalid credentials. Please try again.";
                    globalError.style.display = 'block';
                    submitBtn.disabled = false;
                    btnSpinner.style.display = 'none';
                    btnIcon.style.display = 'block';
                    btnText.textContent = "Sign In";
                }
            });
        });
    </script>
</body>

</html>
