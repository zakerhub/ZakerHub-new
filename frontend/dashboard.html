<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Zaker Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script> 

    <style>
        :root {
            --color-primary-navy: #172a50; 
            --color-primary-accent: #635bff; 
            --color-text-dark: #1a1f36; 
            --color-text-light: #4f566b;
            --color-bg-page: #f7f9fc; 
            --color-white: #ffffff;
            --color-border: #e3e8ee;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-page);
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--color-primary-navy);
            color: white;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo-area { font-size: 1.5rem; font-weight: 800; margin-bottom: 3rem; }
        .logo-hub { color: var(--color-primary-accent); }

        .main-nav { flex-grow: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            color: #a3acb9;
            text-decoration: none;
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }

        /* --- Main Content --- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2rem 4rem;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .user-profile { display: flex; align-items: center; gap: 15px; }
        .profile-info { text-align: right; }
        .user-name { display: block; font-weight: 700; color: var(--color-text-dark); }
        .user-role { font-size: 0.85rem; color: var(--color-text-light); }
        .avatar {
            width: 45px; height: 45px; background: var(--color-primary-accent);
            color: white; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-weight: 700;
        }

        /* --- Course Grid --- */
        .course-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .course-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--color-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .curriculum-tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; font-weight: 800; }
        .dp-tag { background: #e1f5fe; color: #0288d1; }
        .igcse-tag { background: #f3e5f5; color: #7b1fa2; }

        .progress-bar-container { height: 8px; background: #eee; border-radius: 4px; margin: 15px 0 5px; position: relative; }
        .progress-bar { height: 100%; background: var(--color-primary-accent); border-radius: 4px; transition: width 1s ease-in-out; }
        .progress-text { font-size: 0.75rem; color: var(--color-text-light); }

        .btn-card-access {
            display: inline-block; margin-top: 1rem; color: var(--color-primary-accent);
            text-decoration: none; font-weight: 700; font-size: 0.9rem;
        }

        /* --- Section States --- */
        #loading-overlay { font-style: italic; color: var(--color-text-light); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area"><span class="logo-hub">ZH</span> Zaker Hub</div>
        <nav class="main-nav">
            <a href="index.html" class="nav-item"><i data-feather="grid" style="margin-right: 12px;"></i> Home</a>
            <a href="#" class="nav-item active"><i data-feather="book-open" style="margin-right: 12px;"></i> Courses</a>
            <a href="curricula.html" class="nav-item"><i data-feather="file-text" style="margin-right: 12px;"></i> Registration</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" onclick="logout()"><i data-feather="log-out" style="margin-right: 12px;"></i> Log Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1 id="welcomeGreeting">Welcome Back!</h1>
            <div class="user-profile">
                <div class="profile-info">
                    <span class="user-name" id="displayFullName">Loading...</span>
                    <span class="user-role" id="displayRoleInfo">...</span>
                </div>
                <div class="avatar" id="displayInitials">??</div>
            </div>
        </header>

        <section class="dashboard-section">
            <h2>Current Courses</h2>
            <div id="loading-overlay">Fetching your courses...</div>
            <div class="course-cards-container" id="courseGrid">
                </div>
        </section>
    </main>

    <script>
        // --- CONFIG ---
        const API_URL = "https://your-api-domain.com/api";

        // --- UTILITIES ---
        const getCookie = (name) => {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        };

        const logout = () => {
            document.cookie = "zakerHubUserId=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "zakerHubUserStatus=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "signin.html";
        };

        // --- CORE LOGIC ---
        async function initializeDashboard() {
            const userId = getCookie('zakerHubUserId');
            const userStatus = getCookie('zakerHubUserStatus');

            // 1. Auth Guard
            if (!userId || !userStatus) {
                window.location.href = "signin.html";
                return;
            }

            try {
                // 2. Fetch Data in Parallel
                const [userRes, coursesRes] = await Promise.all([
                    fetch(`${API_URL}/users/${userId}`),
                    fetch(`${API_URL}/${userStatus}/courses?id=${userId}`)
                ]);

                const userData = await userRes.json();
                const coursesData = await coursesRes.json();

                // 3. Render Profile
                renderProfile(userData);

                // 4. Render Courses
                renderCourses(coursesData);

            } catch (error) {
                console.error("Dashboard Load Error:", error);
                document.getElementById('loading-overlay').innerText = "Error loading data. Please refresh.";
            } finally {
                feather.replace();
            }
        }

        function renderProfile(user) {
            document.getElementById('welcomeGreeting').innerText = `Welcome Back, ${user.firstName || 'User'}!`;
            document.getElementById('displayFullName').innerText = user.fullName || 'User Name';
            document.getElementById('displayRoleInfo').innerText = user.phone || user.email || 'Member';
            
            const initials = (user.firstName?.[0] || '') + (user.lastName?.[0] || '');
            document.getElementById('displayInitials').innerText = initials.toUpperCase() || 'ZH';
        }

        function renderCourses(courses) {
            const grid = document.getElementById('courseGrid');
            const loader = document.getElementById('loading-overlay');
            
            loader.style.display = 'none';
            grid.innerHTML = "";

            if (!courses || courses.length === 0) {
                grid.innerHTML = "<p>No active courses found.</p>";
                return;
            }

            courses.forEach(course => {
                const card = `
                    <div class="course-card">
                        <div class="card-header">
                            <h3>${course.name}</h3>
                            <span class="curriculum-tag ${course.curriculum.toLowerCase()}-tag">
                                ${course.curriculum}
                            </span>
                        </div>
                        <p class="instructor" style="font-size: 0.9rem; color: #4f566b;">
                            Instructor: ${course.instructorName}
                        </p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${course.progress}%"></div>
                        </div>
                        <span class="progress-text">${course.progress}% Complete</span>
                        <br>
                        <a href="course.html?course=${course.id}" class="btn-card-access">Access Course →</a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>
</html>
