<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course | Zaker Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --color-navy: #2b3954;
            --color-light-gray: #e0e0e0;
            --color-bg: #f8f9fc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            margin: 0;
            padding: 0;
        }
        /* Top Navbar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: white;
            border-bottom: 1px solid #ccc;
        }
        .btn-back {
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 15px;
            color: #555;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:hover {
            background: #f0f0f0;
            color: #333;
        }
        .nav-logo img {
            height: 120px;
            margin: -15px 0;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-info {
            text-align: right;
        }
        .user-name {
            display: block;
            font-weight: 700;
            color: #1a1f36; /* matching dashboard var(--color-text-dark) */
            font-size: 1rem;
        }
        .user-role {
            display: block;
            font-size: 0.85rem;
            color: #4f566b; /* matching dashboard var(--color-text-light) */
        }
        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #635bff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }
        /* Banner */
        .banner-wrapper {
            padding: 20px 40px;
            text-align: center;
        }
        .banner-img {
            height: 220px;
            background-image: url('images/cover.jpeg');
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .teacher-badge {
            background-color: var(--color-navy);
            color: white;
            display: inline-block;
            padding: 15px 80px;
            border-radius: 30px;
            transform: translateY(-50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .teacher-badge h2 {
            margin: 0;
            font-size: 2rem;
            font-weight: 400;
            font-family: 'Playfair Display', serif;
        }
        .teacher-badge p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        /* Main Layout */
        .course-container {
            display: flex;
            gap: 30px;
            padding: 0 40px 40px;
            border-top: 1px solid #ccc;
            margin-top: -40px;
            padding-top: 40px;
        }
        /* Sidebar Tabs */
        .side-tabs {
            width: 220px;
            flex-shrink: 0;
        }
        .tab-btn {
            width: 100%;
            height: 120px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--color-navy);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .tab-btn i {
            margin-bottom: 10px;
        }
        .tab-btn.active {
            background: var(--color-navy);
            color: white;
            border-color: var(--color-navy);
        }
        
        /* Content Area */
        .content-area {
            flex-grow: 1;
            border-left: 2px solid #e0e0e0;
            padding-left: 30px;
        }
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom Table/List */
        .custom-list-header {
            background-color: var(--color-navy);
            color: white;
            border-radius: 25px;
            display: flex;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            overflow: hidden;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .list-container {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }
        /* Custom Scrollbar for list-container */
        .list-container::-webkit-scrollbar {
            width: 6px;
        }
        .list-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 10px;
        }
        .list-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        .list-row {
            background-color: var(--color-light-gray);
            border-radius: 25px;
            display: flex;
            margin-bottom: 10px;
            align-items: center;
            font-weight: 500;
            color: #333;
        }
        
        /* Columns */
        .col-name { flex: 1; padding: 12px 30px; }
        .col-date { width: 180px; padding: 12px 10px; text-align: center; }
        .col-action { width: 220px; padding: 12px 10px; display:flex; justify-content:center; align-items:center; gap: 15px; }
        
        .custom-list-header .col-date, .custom-list-header .col-action {
            border-left: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .list-row .col-date, .list-row .col-action {
            border-left: 2px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Buttons */
        .btn-navy {
            background-color: var(--color-navy);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-navy:hover {
            background-color: #1a2436;
            color: white;
        }
        .text-muted-custom {
            color: #555;
            font-size: 0.95rem;
        }
        
        /* Scroll indicator (aesthetic) */
        .scroll-indicator {
            border-left: 6px solid #a0a0a0;
            padding-left: 15px;
            border-radius: 4px;
        }
        
        /* Teacher Form Styles */
        .form-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="auth-loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; justify-content:center; align-items:center;">
        <h3>Loading Course...</h3>
    </div>

    <!-- Top Nav -->
    <nav class="top-nav">
        <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Return to dashboard</a>
        <div class="nav-logo">
            <img src="images/logo.png" alt="Zaker Hub" style="mix-blend-mode: multiply;">
        </div>
        <div class="user-profile">
            <div class="profile-info">
                <span class="user-name" id="userName">Loading...</span>
                <span class="user-role" id="userRole">...</span>
            </div>
            <div class="user-avatar" id="userInitials">??</div>
        </div>
    </nav>

    <!-- Banner -->
    <div class="banner-wrapper">
        <div class="banner-img"></div>
        <div class="teacher-badge">
            <h2 id="teacherNameDisplay">Teacher Name</h2>
            <p id="courseNameDisplay">course name</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="course-container">
        <!-- Left Tabs -->
        <div class="side-tabs">
            <button class="tab-btn active" onclick="switchTab('assignments', this)">
                <i class="fa-solid fa-book-open-reader fa-2x"></i>
                Assignments
            </button>
            <button class="tab-btn" onclick="switchTab('meetings', this)">
                <i class="fa-solid fa-laptop-code fa-2x"></i>
                Online meetings
            </button>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            
            <!-- Assignments Tab -->
            <div id="tab-assignments" class="tab-pane active scroll-indicator">
                <div class="list-container">
                    <div class="custom-list-header">
                        <div class="col-name">Assignments:</div>
                        <div class="col-date">Date:</div>
                        <div class="col-action">Submit <i class="fa-solid fa-arrow-down ms-2"></i></div>
                    </div>
                    <div id="assignmentsList">
                        <!-- Items populated via JS -->
                    </div>
                </div>
            </div>

            <!-- Meetings Tab -->
            <div id="tab-meetings" class="tab-pane">
                <div class="row">
                    <!-- Live Sessions -->
                    <div class="col-md-6 scroll-indicator">
                        <div class="list-container">
                            <div class="custom-list-header">
                                <div class="col-name">Live sessions:</div>
                                <div class="col-date">Date:</div>
                            </div>
                            <div id="liveList">
                                <!-- Items populated via JS -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Recorded Sessions -->
                    <div class="col-md-6 scroll-indicator">
                        <div class="list-container">
                            <div class="custom-list-header">
                                <div class="col-name">Recorded sessions:</div>
                                <div class="col-date">Date:</div>
                            </div>
                            <div id="recordedList">
                                <!-- Items populated via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content" style="background-color: var(--color-bg);">
          <div class="modal-header border-0 pb-2">
            <h5 class="modal-title fw-bold" id="videoModalTitle" style="color: var(--color-navy);">Recorded Session</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="closeVideo()"></button>
          </div>
          <div class="modal-body p-3 pt-0">
            <div class="ratio ratio-16x9 bg-black rounded shadow-sm overflow-hidden">
                <iframe id="videoIframe" src="" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen style="border: none;"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentCourseId = urlParams.get('id') || urlParams.get('course');
        let videoModalInstance;

        async function init() {
            if (!ZakerAPI.auth.isAuthenticated()) {
                window.location.href = "signin.html";
                return;
            }
            if (!currentCourseId) {
                window.location.href = "dashboard.html";
                return;
            }

            const user = ZakerAPI.auth.getUser();
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userRole').innerText = user.role.charAt(0) + user.role.slice(1).toLowerCase();
            document.getElementById('userInitials').innerText = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);

            try {
                const courseData = await ZakerAPI.fetch(`/academics/courses/${currentCourseId}/`);
                document.getElementById('teacherNameDisplay').innerText = courseData.teacher_name || 'Instructor';
                document.getElementById('courseNameDisplay').innerText = courseData.name || 'Course Name';

                await fetchItems();

                document.getElementById('auth-loader').style.display = 'none';
            } catch (err) {
                console.error(err);
                alert("Error loading course details.");
            }
            
            const modalEl = document.getElementById('videoModal');
            videoModalInstance = new bootstrap.Modal(modalEl);
            modalEl.addEventListener('hidden.bs.modal', function () {
                document.getElementById('videoIframe').src = "";
            });
        }

        async function fetchItems() {
            try {
                const items = await ZakerAPI.fetch(`/academics/items/?course=${currentCourseId}`);
                
                const assignments = items.filter(i => i.type === 'ASSIGNMENT' || i.type === 'MATERIAL');
                const live = items.filter(i => i.type === 'MEETING');
                const recorded = items.filter(i => i.type === 'RECORDED_SESSION');

                renderAssignments(assignments);
                renderLiveSessions(live);
                renderRecordedSessions(recorded);
            } catch (err) {
                console.error(err);
            }
        }

        function renderAssignments(items) {
            const container = document.getElementById('assignmentsList');
            if (items.length === 0) {
                container.innerHTML = '<div class="list-row text-center d-block">No assignments found.</div>';
                return;
            }
            container.innerHTML = items.map(i => {
                const dateStr = formatDateTime(i.created_at);
                const downloadBtn = i.file ? `<a href="${i.file}" target="_blank" class="btn-navy">Download</a>` : `<span class="text-muted-custom" style="width: 80px; display:inline-block; text-align:center;">-</span>`;
                return `
                <div class="list-row">
                    <div class="col-name">${i.title}</div>
                    <div class="col-date">${dateStr}</div>
                    <div class="col-action">
                        ${downloadBtn}
                        <a href="assignment.html?id=${i.id}" class="text-muted-custom text-decoration-none">Submit here</a>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderLiveSessions(items) {
            const container = document.getElementById('liveList');
            if (items.length === 0) {
                container.innerHTML = '<div class="list-row text-center d-block">No live sessions.</div>';
                return;
            }
            container.innerHTML = items.map(i => {
                const dateStr = formatDateTime(i.created_at);
                const joinBtn = i.content_url ? `<a href="${i.content_url}" target="_blank" class="btn-navy">Join</a>` : `<span class="text-muted-custom">-</span>`;
                return `
                <div class="list-row">
                    <div class="col-name" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${i.title}</span>
                        ${joinBtn}
                    </div>
                    <div class="col-date">${dateStr}</div>
                </div>
                `;
            }).join('');
        }

        function renderRecordedSessions(items) {
            const container = document.getElementById('recordedList');
            if (items.length === 0) {
                container.innerHTML = '<div class="list-row text-center d-block">No recorded sessions.</div>';
                return;
            }
            container.innerHTML = items.map(i => {
                const dateStr = formatDateTime(i.created_at);
                const watchBtn = i.video_id ? `<button onclick="playVideo('${i.title}', '${i.video_id}')" class="btn-navy">Watch</button>` : `<span class="text-muted-custom">Processing</span>`;
                return `
                <div class="list-row">
                    <div class="col-name" style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${i.title}</span>
                        ${watchBtn}
                    </div>
                    <div class="col-date">${dateStr}</div>
                </div>
                `;
            }).join('');
        }

        function formatDateTime(isoString) {
            const d = new Date(isoString);
            const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `Today ${time}`; 
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btnElement.classList.add('active');
        }

        function playVideo(title, videoId) {
            document.getElementById('videoModalTitle').innerText = title;
            // Using Vimeo iframe embed format
            document.getElementById('videoIframe').src = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
            videoModalInstance.show();
        }

        function closeVideo() {
            document.getElementById('videoIframe').src = "";
        }

        window.onload = init;
    </script>
</body>
</html>
